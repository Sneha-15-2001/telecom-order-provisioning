<header class="topbar">
  <a class="brand" routerLink="/">
    <span class="brand-mark"><i></i><i></i><i></i></span>
    <span>NexaTel<small>ORDER HUB</small></span>
  </a>
  <nav class="nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
    <a routerLink="/customers" routerLinkActive="active">Customers</a>
    <a routerLink="/orders" routerLinkActive="active">Orders</a>
    <a routerLink="/inventory" routerLinkActive="active">Inventory</a>
    <a routerLink="/provisioning" routerLinkActive="active">Provisioning</a>
    <a routerLink="/notifications" routerLinkActive="active">Notifications</a>
    <a routerLink="/incidents" routerLinkActive="active">Incidents</a>
  </nav>
  <button class="theme-toggle" (click)="theme.toggle()" [attr.aria-label]="theme.theme() === 'light' ? 'Switch to dark mode' : 'Switch to light mode'" title="Toggle dark / light mode">
    @if (theme.theme() === 'light') {
      <span>🌙 Dark</span>
    } @else {
      <span>☀️ Light</span>
    }
  </button>
</header>

<router-outlet />

<app-chat-widget />
